# Runs the backup tool's tests whenever it changes, so a refactor cannot quietly
# weaken a safety check (completeness, credential scan, restore never deletes).
# Needs no secrets and never touches a database: everything runs against stubs
# and an in-process Postgres.

name: Backup tool tests

on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - 'supabase/migrations/0004_backup_schema_function.sql'
      - '.github/workflows/offsite-backup.yml'
      - '.github/workflows/backup-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run backup:test
